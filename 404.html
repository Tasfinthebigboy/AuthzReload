<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

  body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    background: #0d0d0d;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    text-align: center;
  }

  h1 {
    font-size: 10rem;
    margin: 0;
    position: relative;
    color: #ff3c78;
    animation: glitch 1s infinite;
  }

  h1::before,
  h1::after {
    content: '404';
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    overflow: hidden;
    clip: rect(0, 900px, 0, 0);
  }

  h1::before {
    animation: glitchTop 2s infinite linear;
    color: #00fff9;
  }

  h1::after {
    animation: glitchBottom 3s infinite linear;
    color: #fffa00;
  }

  @keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-5px, 5px); }
    40% { transform: translate(5px, -5px); }
    60% { transform: translate(-5px, 5px); }
    80% { transform: translate(5px, -5px); }
    100% { transform: translate(0); }
  }

  @keyframes glitchTop {
    0% { clip: rect(0, 900px, 0, 0); }
    10% { clip: rect(10px, 900px, 50px, 0); }
    20% { clip: rect(20px, 900px, 60px, 0); }
    30% { clip: rect(0, 900px, 40px, 0); }
    100% { clip: rect(0, 900px, 0, 0); }
  }

  @keyframes glitchBottom {
    0% { clip: rect(0, 900px, 0, 0); }
    10% { clip: rect(60px, 900px, 80px, 0); }
    20% { clip: rect(50px, 900px, 90px, 0); }
    30% { clip: rect(70px, 900px, 110px, 0); }
    100% { clip: rect(0, 900px, 0, 0); }
  }

  h2 {
    font-size: 2rem;
    margin: 0 0 20px;
  }

  p {
    font-size: 1.2rem;
    margin-bottom: 30px;
    color: #aaa;
  }

  a {
    text-decoration: none;
    padding: 12px 30px;
    background-color: #ff3c78;
    color: white;
    border-radius: 6px;
    transition: 0.3s;
    font-weight: bold;
  }

  a:hover {
    background-color: #ff1a5a;
  }

  /* Floating glitch particles */
  .particle {
    position: absolute;
    background: #ff3c78;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    animation: float 3s infinite ease-in-out;
    opacity: 0.7;
  }

  @keyframes float {
    0% { transform: translateY(0px) translateX(0px); opacity: 0.7; }
    50% { transform: translateY(-50px) translateX(20px); opacity: 0.3; }
    100% { transform: translateY(0px) translateX(0px); opacity: 0.7; }
  }
</style>
</head>
<body>
  <h1>404</h1>
  <h2>Oops! Page not found</h2>
  <p>The page you are looking for does not exist or has been moved.</p>
  <a href="/">Go Back Home</a>

  <!-- Floating particles -->
  <div class="particle" style="top:10%; left:20%; animation-delay:0s;"></div>
  <div class="particle" style="top:30%; left:70%; animation-delay:1s;"></div>
  <div class="particle" style="top:50%; left:40%; animation-delay:2s;"></div>
  <div class="particle" style="top:80%; left:60%; animation-delay:1.5s;"></div>
  <div class="particle" style="top:20%; left:50%; animation-delay:0.5s;"></div>
</body>
</html>
